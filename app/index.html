<!doctype html>
<!--
  ═══════════════════════════════════════════════════════════════
   TLW Games Launcher — TELA
   Pode editar à vontade: cores, textos, layout.

   • Cores principais: no começo do <style>, em ":root"
     (--acento é o laranja, --verde é o botão Jogar).
   • Textos dos botões e da tela: no <script>, nas funções render...
   • Imagens: coloque o arquivo (ex.: logo.png) nesta pasta e use
     <img src="logo.png">.

   Não precisa mexer no launcher.js. Ele coloca sozinho a "ponte"
   (o objeto tlw) que faz os botões Instalar/Jogar funcionarem.
   Dica: com o launcher aberto, aperte Ctrl+R pra ver suas mudanças.
  ═══════════════════════════════════════════════════════════════
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<title>TLW Games Launcher</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='14' width='56' height='36' rx='6' fill='%23ff5a1f' transform='skewX(-10) translate(5 0)'/%3E%3Ctext x='33' y='41' font-family='Arial Black,Arial' font-weight='900' font-size='21' fill='white' text-anchor='middle'%3ETLW%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #0b0d12;
  --lateral: #0f1218;
  --painel: #141821;
  --painel2: #1b202b;
  --borda: #242a37;
  --txt: #e9ebf1;
  --txt2: #8a93a8;
  --txt3: #5d667a;
  --acento: #ff5a1f;
  --acento2: #ffb800;
  --verde: #33d17a;
  --vermelho: #ff4d5e;
  --titulo: "Segoe UI Black", "Arial Black", "Segoe UI", system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; }

html, body { height: 100%; }

body {
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--txt);
  font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
  overflow: hidden;
  user-select: none;
}

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
svg { width: 20px; height: 20px; flex: none; }
code { background: var(--painel2); padding: 1px 6px; border-radius: 4px; font-size: 13px; }

/* ───────── topo ───────── */

.topo {
  height: 56px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 28px;
  padding: 0 18px 0 20px;
  background: linear-gradient(180deg, #11141b, #0d1016);
  border-bottom: 1px solid var(--borda);
}

.marca { display: flex; align-items: center; gap: 8px; }
.marca-tlw {
  font: 900 17px var(--titulo);
  padding: 2px 9px 2px 8px;
  background: linear-gradient(135deg, var(--acento), #ff2d55);
  transform: skewX(-12deg);
  border-radius: 3px;
  letter-spacing: .02em;
}
.marca-games { font: 800 13px var(--titulo); letter-spacing: .32em; color: var(--txt2); }
.marca-logo { height: 34px; max-width: 200px; object-fit: contain; }

.abas { display: flex; gap: 4px; height: 100%; }
.aba {
  position: relative;
  padding: 0 14px;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--txt2);
}
.aba.ativa { color: var(--txt); }
.aba.ativa::after {
  content: "";
  position: absolute;
  left: 14px; right: 14px; bottom: -1px;
  height: 2px;
  background: var(--acento);
}

.topo-dir { margin-left: auto; display: flex; align-items: center; gap: 12px; }

.status { font-size: 12px; color: var(--txt2); display: flex; align-items: center; gap: 7px; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--txt3); }
.status.on::before { background: var(--verde); box-shadow: 0 0 8px var(--verde); }

.icone {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 8px;
  color: var(--txt2);
  transition: background .15s, color .15s;
}
.icone:hover { background: var(--painel2); color: var(--txt); }
.icone.perigo:hover { color: var(--vermelho); }
.icone.girando svg { animation: girar .8s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }

/* ───────── corpo ───────── */

.corpo { flex: 1; display: grid; grid-template-columns: 280px 1fr; min-height: 0; }

.lateral {
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 14px 10px;
  background: var(--lateral);
  border-right: 1px solid var(--borda);
}

.busca {
  margin: 0 4px 14px;
  height: 36px;
  padding: 0 12px;
  border-radius: 8px;
  border: 1px solid var(--borda);
  background: var(--painel);
  color: var(--txt);
  font: inherit;
  outline: none;
}
.busca:focus { border-color: var(--acento); }
.busca::placeholder { color: var(--txt3); }

.lateral-titulo {
  padding: 0 8px 8px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--txt3);
}

.lista { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }

.item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 7px 8px;
  border-radius: 8px;
  text-align: left;
  transition: background .12s;
}
.item:hover { background: var(--painel); }
.item.sel { background: var(--painel2); box-shadow: inset 3px 0 0 var(--acento); }

.item-txt { display: flex; flex-direction: column; min-width: 0; }
.item-nome { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-sub { font-size: 12px; color: var(--txt3); }
.item.instalado .item-sub, .item.rodando .item-sub { color: var(--verde); }
.item.atualizar .item-sub { color: var(--acento2); }
.item.ocupado .item-sub { color: var(--acento); }

.vazio-lista { padding: 12px; color: var(--txt3); font-size: 13px; }

/* ───────── arte ───────── */

.arte { position: relative; overflow: hidden; background-color: var(--painel2); }
.arte-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.arte.gerada {
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    repeating-linear-gradient(-55deg, rgba(255, 255, 255, .035) 0 14px, transparent 14px 28px),
    radial-gradient(circle at 78% 28%, hsl(var(--h) 90% 55% / .55), transparent 55%),
    linear-gradient(135deg, hsl(var(--h) 65% 22%), hsl(calc(var(--h) + 50) 70% 8%));
}
.arte .ini { font-family: var(--titulo); font-weight: 900; color: rgba(255, 255, 255, .92); font-style: italic; }

.arte.mini { width: 44px; height: 44px; flex: none; border-radius: 8px; }
.arte.mini .ini { font-size: 12px; letter-spacing: -.02em; }

/* ───────── detalhe ───────── */

.detalhe { overflow-y: auto; min-height: 0; }

.hero { position: relative; height: clamp(280px, 34vw, 470px); overflow: hidden; }
.hero-arte { position: absolute; inset: 0; }
/* O banner é mais largo que a capa: corta mais embaixo que em cima, pra não cortar cabeças e títulos. */
.hero-arte .arte-img { object-position: center 28%; }
.hero-arte.gerada { justify-content: flex-end; padding-right: 6%; }
.hero-arte .ini { font-size: 170px; opacity: .14; letter-spacing: -.04em; }
.hero-sombra {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(11, 13, 18, 0) 30%, rgba(11, 13, 18, .75) 72%, var(--bg));
}
.hero-info { position: absolute; left: 36px; right: 36px; bottom: 96px; }
/* Com capa, o banner fica limpo (a capa já tem o logo do jogo), igual numa loja de jogos. */
.hero:has(.arte-img) .hero-info { display: none; }
.hero:has(.arte-img) .hero-sombra { background: linear-gradient(180deg, rgba(11, 13, 18, 0) 62%, rgba(11, 13, 18, .55)); }
.hero-info h1 {
  font: 900 44px/1.05 var(--titulo);
  text-transform: uppercase;
  letter-spacing: -.01em;
  text-shadow: 0 4px 24px rgba(0, 0, 0, .6);
}
.dev { margin-top: 6px; color: var(--txt2); font-weight: 600; }
.etiqueta {
  display: inline-block;
  margin-bottom: 10px;
  padding: 3px 10px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--acento) 16%, transparent);
  color: color-mix(in srgb, var(--acento) 70%, white);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
}

.barra-acao {
  position: relative;
  display: flex;
  align-items: center;
  gap: 30px;
  min-height: 70px;
  margin-top: -70px;
  padding: 11px 24px 11px 20px;
  background: rgba(16, 19, 27, .74);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  border-top: 1px solid rgba(255, 255, 255, .07);
  border-bottom: 1px solid var(--borda);
}

.btn {
  height: 46px;
  min-width: 190px;
  padding: 0 26px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border-radius: 4px;
  font-weight: 800;
  font-size: 15px;
  letter-spacing: .08em;
  text-transform: uppercase;
  transition: filter .15s, transform .08s;
}
.btn:not(:disabled):hover { filter: brightness(1.1); }
.btn:not(:disabled):active { transform: translateY(1px); }
.btn:disabled { cursor: default; }
.btn-jogar { background: linear-gradient(180deg, #45e08a, #1fb866); color: #04230f; box-shadow: 0 6px 22px rgba(51, 209, 122, .25); }
.btn-prim { background: linear-gradient(180deg, rgba(255, 255, 255, .14), rgba(0, 0, 0, .1)), var(--acento); color: #fff; box-shadow: 0 6px 22px color-mix(in srgb, var(--acento) 28%, transparent); }
.btn-atual { background: linear-gradient(180deg, #ffcb45, #f0a300); color: #2a1b00; box-shadow: 0 6px 22px rgba(255, 184, 0, .22); }
.btn-sec { background: var(--painel2); border: 1px solid var(--borda); color: var(--txt); }
.btn-sec:disabled { color: var(--txt3); }
.btn-jogando { background: #173325; color: #7fe3ab; }

/* Altura fixa + quebra escondida: em janela pequena, as informações que não cabem somem sozinhas (as últimas primeiro). */
.stats { flex: 1; min-width: 0; height: 46px; overflow: hidden; display: flex; flex-wrap: wrap; column-gap: 30px; }
.stat { height: 46px; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.stat svg { width: 26px; height: 26px; color: var(--txt2); }
.stat-txt { display: flex; flex-direction: column; line-height: 1.3; }
.stat-k { font-size: 12.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #d5d9e3; }
.stat-v { font-size: 12.5px; color: var(--txt2); }

.extras { margin-left: auto; display: flex; gap: 6px; }
.extras .icone { width: 38px; height: 34px; border-radius: 4px; background: rgba(255, 255, 255, .08); color: #c3c8d4; }
.extras .icone:hover { background: rgba(255, 255, 255, .16); }

.progresso { flex: 1; min-width: 0; }
.progresso-txt { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; font-size: 13px; }
.progresso-txt span:first-child { font-weight: 700; }
.progresso-num { color: var(--txt2); font-variant-numeric: tabular-nums; }
.trilho { height: 8px; border-radius: 99px; background: #232938; overflow: hidden; }
.enchimento {
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--acento), var(--acento2));
  transition: width .25s ease;
}
.enchimento.indet {
  background: repeating-linear-gradient(-45deg, var(--acento) 0 12px, var(--acento2) 12px 24px);
  background-size: 34px 34px;
  animation: listras .6s linear infinite;
}
@keyframes listras { to { background-position: 34px 0; } }

.aviso {
  margin: 14px 24px 0;
  padding: 10px 14px;
  border-radius: 8px;
  background: rgba(255, 184, 0, .08);
  border: 1px solid rgba(255, 184, 0, .25);
  color: #ffd36b;
  font-size: 13px;
}

.info { display: grid; grid-template-columns: 3fr 2fr; gap: 18px; padding: 22px 24px 36px; align-items: start; }
.bloco { padding: 18px 20px; border-radius: 12px; background: var(--painel); border: 1px solid var(--borda); }
.bloco h3 { margin-bottom: 8px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--txt3); }
/* pre-line: respeita as quebras de linha e os parágrafos que você digita no Admin */
.bloco p { color: #c6cad6; user-select: text; white-space: pre-line; overflow-wrap: anywhere; }
.bloco .ficha { margin-bottom: 10px; font-size: 12.5px; font-weight: 600; color: var(--txt2); white-space: normal; }

.vazio, .carregando {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: var(--txt2);
  text-align: center;
}
.vazio h2 { font: 900 22px var(--titulo); color: var(--txt); }
.spinner {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 3px solid var(--borda);
  border-top-color: var(--acento);
  animation: girar .8s linear infinite;
}

/* ───────── avisos ───────── */

.toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
.toast {
  max-width: 360px;
  padding: 11px 16px;
  border-radius: 8px;
  background: var(--painel2);
  border: 1px solid var(--borda);
  border-left: 3px solid var(--txt2);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
  animation: entrar .2s ease;
  transition: opacity .4s, transform .4s;
}
.toast.ok { border-left-color: var(--verde); }
.toast.erro { border-left-color: var(--vermelho); }
.toast.saindo { opacity: 0; transform: translateY(6px); }
@keyframes entrar { from { opacity: 0; transform: translateY(8px); } }

/* ───────── rolagem ───────── */

::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-thumb { background: #262c3a; border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background-color: #333b4d; }


/* ───────── organizar / modos ───────── */
.ferramentas { display: flex; gap: 6px; margin: 0 4px 12px; }
.org { position: relative; flex: 1; min-width: 0; }
.org-btn { width: 100%; height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: 8px;
  background: var(--painel); border: 1px solid var(--borda); color: var(--txt2); font-size: 12.5px; font-weight: 600; }
.org-btn:hover, .org.aberto .org-btn { color: var(--txt); border-color: #343b4c; }
.org-btn span { flex: 1; min-width: 0; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.org-btn svg { width: 16px; height: 16px; }
.org-btn .seta-baixo { width: 14px; height: 14px; transition: transform .15s; }
.org.aberto .seta-baixo { transform: rotate(180deg); }
.org-menu, .menu { display: none; position: absolute; z-index: 30; min-width: 230px; padding: 6px; border-radius: 10px;
  background: #1a1f2a; border: 1px solid #2c3343; box-shadow: 0 18px 40px rgba(0, 0, 0, .5); }
.org-menu { top: calc(100% + 6px); left: 0; }
.org.aberto .org-menu, .extras.aberto .menu { display: block; }
.org-titulo { padding: 8px 10px 4px; font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--txt3); }
.org-menu button, .menu button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px;
  text-align: left; font-size: 13px; color: #d5d9e3; }
.org-menu button:hover, .menu button:hover { background: rgba(255, 255, 255, .07); }
.org-menu button::before { content: ""; width: 14px; flex: none; text-align: center; color: var(--acento); font-weight: 900; }
.org-menu button.on::before { content: "✓"; }
.org-menu button.on { color: #fff; font-weight: 600; }
.modos { display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--painel); border: 1px solid var(--borda); flex: none; }
.modos button { width: 30px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: var(--txt3); }
.modos button svg { width: 16px; height: 16px; }
.modos button:hover { color: var(--txt); }
.modos button.on { background: var(--painel2); color: var(--txt); box-shadow: inset 0 0 0 1px #343b4c; }
.lateral-titulo .qtd { color: var(--txt3); font-weight: 600; letter-spacing: 0; }
.lateral-titulo + .item { margin-top: 0; }
.lista .lateral-titulo:not(:first-child) { margin-top: 12px; }
.limpar-filtro { margin-top: 6px; color: var(--acento); font-weight: 600; font-size: 13px; }

/* ───────── modo grade ───────── */
body.modo-grade .corpo { grid-template-columns: 1fr; }
body.modo-grade .lateral { display: none; }
.grade-pagina { padding: 26px 30px 50px; }
.grade-topo { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
.grade-topo h2 { font: 900 24px var(--titulo); margin-right: auto; }
.grade-topo h2 .qtd { font: 600 14px "Segoe UI", system-ui, sans-serif; color: var(--txt3); margin-left: 8px; }
.grade-topo .busca { margin: 0; width: 240px; }
.grade-topo .org { flex: none; width: 230px; }
.grade-topo .org-menu { left: auto; right: 0; }
.grade-secao { margin: 26px 0 12px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--txt2); }
.grade-secao:first-child { margin-top: 0; }
.grade-secao .qtd { color: var(--txt3); }
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 22px 18px; }
.card { cursor: pointer; outline: none; min-width: 0; }
.card-capa { position: relative; border-radius: 10px; overflow: hidden; background: var(--painel2);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .35); transition: transform .18s ease, box-shadow .18s ease; }
.card:hover .card-capa, .card:focus-visible .card-capa { transform: translateY(-3px);
  box-shadow: 0 14px 32px rgba(0, 0, 0, .5), 0 0 0 2px color-mix(in srgb, var(--acento) 70%, transparent); }
.arte.card-arte { width: 100%; aspect-ratio: 16 / 9; }
.arte.card-arte .ini { font-size: 46px; letter-spacing: -.03em; }
.card:not(.instalado):not(.rodando):not(.atualizar) .card-capa .arte-img { filter: saturate(.8) brightness(.88); }
.card-rapido { position: absolute; right: 10px; bottom: 10px; width: 44px; height: 44px; display: grid; place-items: center;
  border-radius: 50%; opacity: 0; transform: translateY(6px) scale(.9); transition: opacity .15s, transform .15s;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .45); }
.card-rapido svg { width: 20px; height: 20px; }
.card:hover .card-rapido, .card:focus-within .card-rapido { opacity: 1; transform: none; }
.card-rapido.jogar { background: linear-gradient(180deg, #45e08a, #1fb866); color: #04230f; }
.card-rapido.instalar { background: var(--acento); color: #fff; }
.card-rapido.atualizar { background: linear-gradient(180deg, #ffcb45, #f0a300); color: #2a1b00; }
.card-rapido:hover { filter: brightness(1.12); }
.card-selo { position: absolute; left: 10px; top: 10px; padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase; background: rgba(8, 10, 14, .78); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.card-selo.atualizar { color: #ffd36b; }
.card-selo.rodando { color: #7fe3ab; }
.card-selo.embreve { color: var(--txt2); }
.card-prog { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(0, 0, 0, .55); display: none; }
.card.ocupado .card-prog { display: block; }
.card-prog div { height: 100%; width: 0; background: linear-gradient(90deg, var(--acento), var(--acento2)); transition: width .25s; }
.card-nome { margin-top: 10px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-sub { font-size: 12.5px; color: var(--txt3); }
.card.instalado .card-sub, .card.rodando .card-sub { color: var(--verde); }
.card.atualizar .card-sub { color: var(--acento2); }
.card.ocupado .card-sub { color: var(--acento); }
.grade-vazia { padding: 60px 20px; text-align: center; color: var(--txt2); }
.voltar { position: absolute; top: 14px; left: 16px; z-index: 3; height: 34px; display: flex; align-items: center; gap: 6px;
  padding: 0 14px 0 10px; border-radius: 8px; font-size: 13px; font-weight: 700; color: #fff;
  background: rgba(8, 10, 14, .62); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, .1); }
.voltar:hover { background: rgba(8, 10, 14, .85); }
.voltar svg { width: 18px; height: 18px; }

/* ───────── menu ⚙ do jogo ───────── */
.extras { position: relative; }
.menu { top: calc(100% + 8px); right: 0; min-width: 300px; }
.menu button svg { width: 17px; height: 17px; color: var(--txt2); }
.menu button.perigo, .menu button.perigo svg { color: #ff7d8a; }
.menu hr { border: 0; height: 1px; margin: 5px 4px; background: #2c3343; }
.menu .feito { margin-left: auto; font-size: 11px; color: var(--verde); font-weight: 700; }
.extras.aberto .menu-btn { background: rgba(255, 255, 255, .18); }


/* ───────── download: fila / pausado ───────── */

/* ícones das abas */

<script>

    + '<div style="max-width:560px"><h2 style="font:900 24px Segoe UI Black,Arial Black,sans-serif;margin-bottom:10px">Abra pelo launcher.js</h2>'
    + '<p style="color:#8a93a8;line-height:1.6">Este arquivo é só a tela. Pra funcionar, abra a pasta no cmd e rode <code style="background:#1b202b;padding:2px 6px;border-radius:4px">node launcher.js</code>.<br>'
    + 'No ExeForge, converta o <b>launcher.js</b> no modo <b>Node.js</b> (incluindo a pasta toda), e não o HTML.</p></div></div>';
  throw new Error('Tela aberta sem o motor (launcher.js).');
}

const ui = { jogos: [], online: false, selecionado: null, progresso: {}, busca: '' };

// Como a pessoa prefere ver a biblioteca (fica salvo neste computador).
const PREFS = 'tlw-biblioteca';
Object.assign(ui, { modo: 'lista', ordem: 'padrao', filtro: 'todos', gradeAberta: false, orgAberto: false, menuAberto: false });
try {
  const salvo = JSON.parse(localStorage.getItem(PREFS)) || {};
  if (['lista', 'grade'].includes(salvo.modo)) ui.modo = salvo.modo;
  if (typeof salvo.ordem === 'string') ui.ordem = salvo.ordem;
  if (typeof salvo.filtro === 'string') ui.filtro = salvo.filtro;
} catch { /* sem preferências salvas */ }
const salvarPrefs = () => {
  try { localStorage.setItem(PREFS, JSON.stringify({ modo: ui.modo, ordem: ui.ordem, filtro: ui.filtro })); } catch { /* ok */ }
};
const $ = (s) => document.querySelector(s);

// ───────────── formatação ─────────────

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function fmtBytes(b) {
  if (!b) return '—';
  const u = ['B', 'KB', 'MB', 'GB'];
  let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return `${b.toLocaleString('pt-BR', { maximumFractionDigits: i >= 2 ? 1 : 0 })} ${u[i]}`;
}

function fmtTempo(ms) {
  if (!ms) return 'Nunca jogado';
  const min = Math.floor(ms / 60000);
  if (min < 1) return 'Menos de 1 minuto';
  if (min < 60) return `${min} ${min === 1 ? 'minuto' : 'minutos'}`;
  return `${(min / 60).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} horas`;
}

const fmtNum = (n) => Number(n || 0).toLocaleString('pt-BR');
const fmtDataCurta = (t) => new Date(t).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
const fmtDataHora = (t) => new Date(t).toLocaleString('pt-BR', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

function textoContagem(alvo) {
  const falta = alvo - Date.now();
  if (falta <= 0) return 'Chega a qualquer momento';
  const s = Math.floor(falta / 1000);
  const d = Math.floor(s / 86400);
  const h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  const pad = (n) => String(n).padStart(2, '0');
  return `${d ? `${d}d ` : ''}${pad(h)}h ${pad(m)}min ${pad(s % 60)}s`;
}

function fmtData(t) {
  if (!t) return 'Nunca';
  const d = new Date(t);
  const hoje = new Date();
  const dia = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const dif = Math.round((dia(hoje) - dia(d)) / 86400000);
  if (dif === 0) return 'Hoje';
  if (dif === 1) return 'Ontem';
  const opc = { day: 'numeric', month: 'short' };
  if (d.getFullYear() !== hoje.getFullYear()) opc.year = 'numeric';
  return d.toLocaleDateString('pt-BR', opc);
}
const pct = (p) => (p && p.total ? Math.min(100, Math.floor((p.baixado / p.total) * 100)) : 0);
const limparErro = (e) => String((e && e.message) || e).replace(/^Error invoking remote method '[^']+': (Error: )?/, '');

};
const icone = (n) => ICONES[n] || '';

// ───────────── arte (capa ou gerada) ─────────────

function matiz(id) {
  let h = 0;
  for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return h % 360;
}

function iniciais(nome) {
  return String(nome).split(/\s+/)
    .filter((p) => p.length > 2 || /^[A-ZÀ-Ý0-9]/.test(p))
    .map((p) => p[0]).join('').slice(0, 4).toUpperCase();
}

// Tamanho (em px de tela) de cada lugar onde a capa aparece: a imagem chega já reduzida

function srcImagem(u, w, h, modo) {
  const d = Math.min(3, window.devicePixelRatio || 1);
  return tlw.mini ? tlw.mini(u, w * d, h * d, modo) : u;
}

function arte(j, classe) {

  const tam = TAMANHO_ARTE[classe];

    ? `<img class="arte-img" src="${esc(tam ? srcImagem(j.capa, tam[0], tam[1], 'cover') : j.capa)}" data-orig="${esc(j.capa)}" alt="" referrerpolicy="no-referrer" onerror="${ERRO_IMG}">`

}

const jogoSel = () => ui.jogos.find((j) => j.id === ui.selecionado);

    if (p.fase === 'instalando') return ['Instalando…', 'ocupado'];
    if (p.fase === 'fila') return [`Na fila${p.posicao ? ` (${p.posicao}º)` : ''}`, 'ocupado'];
    if (p.fase === 'pausado') return [`Pausado${p.total ? ` · ${pct(p)}%` : ''}`, 'pausado'];
    if (p.fase === 'reconectando') return ['Reconectando…', 'ocupado'];
    return [`Baixando ${pct(p)}%`, 'ocupado'];
  }
  if (j.rodando) return ['Jogando agora', 'rodando'];
  if (j.emBreve) return [j.lancamento ? `Chega ${fmtDataCurta(j.lancamento)}` : 'Em breve', 'embreve'];
  if (j.atualizacao) return ['Atualização disponível', 'atualizar'];
  if (j.instalado) return ['Instalado', 'instalado'];
  return ['Não instalado', ''];
}

// ───────────── organizar a biblioteca ─────────────

const ORDENS = [
  ['padrao', 'Ordem da TLW'],
  ['az', 'Nome (A–Z)'],
  ['za', 'Nome (Z–A)'],
  ['instalados', 'Instalados primeiro'],
  ['recentes', 'Jogados recentemente'],
  ['tempo', 'Mais jogados'],
];
const FILTROS = [['todos', 'Todos os jogos'], ['instalados', 'Só instalados'], ['nao', 'Não instalados']];

const normalizar = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const porNome = (a, b) => a.nome.localeCompare(b.nome, 'pt-BR', { sensitivity: 'base' });

// Devolve os jogos já filtrados e ordenados, em seções ([{ titulo, jogos }]).
function secoes() {
  const termo = normalizar(ui.busca.trim());
  let js = ui.jogos.filter((j) => !termo || normalizar(j.nome).includes(termo));
  if (ui.filtro === 'instalados') js = js.filter((j) => j.instalado);
  if (ui.filtro === 'nao') js = js.filter((j) => !j.instalado);
  const ultima = (j) => (j.instalado && j.instalado.ultimaVez) || 0;
  const tempo = (j) => (j.instalado && j.instalado.tempoJogado) || 0;
  if (ui.ordem === 'az') js.sort(porNome);
  if (ui.ordem === 'za') js.sort((a, b) => porNome(b, a));
  if (ui.ordem === 'recentes') js.sort((a, b) => ultima(b) - ultima(a) || porNome(a, b));
  if (ui.ordem === 'tempo') js.sort((a, b) => tempo(b) - tempo(a) || porNome(a, b));
  if (ui.ordem === 'instalados') {
    return [
      ['Instalados', js.filter((j) => j.instalado)],
      ['Disponíveis', js.filter((j) => !j.instalado && !j.emBreve)],
      ['Em breve', js.filter((j) => !j.instalado && j.emBreve)],
    ].filter(([, l]) => l.length).map(([titulo, jogos]) => ({ titulo, jogos }));
  }
  return js.length ? [{ titulo: null, jogos: js }] : [];
}

function ferramentasHTML(comBusca) {
  const ordem = (ORDENS.find(([k]) => k === ui.ordem) || ORDENS[0])[1];
  const filtro = ui.filtro !== 'todos' ? ` · ${(FILTROS.find(([k]) => k === ui.filtro) || [])[1] || ''}` : '';
  return `${comBusca ? `<input class="busca" data-busca type="search" placeholder="Buscar jogo…" autocomplete="off" value="${esc(ui.busca)}">` : ''}
    <div class="org ${ui.orgAberto ? 'aberto' : ''}">
      <button type="button" class="org-btn" data-organizar title="Organizar a biblioteca">${icone('ordenar')}<span>${esc(ordem + filtro)}</span>${icone('setaBaixo')}</button>
      <div class="org-menu">
        <div class="org-titulo">Ordenar por</div>
        ${ORDENS.map(([k, n]) => `<button type="button" data-ordem="${k}" class="${k === ui.ordem ? 'on' : ''}">${n}</button>`).join('')}
        <div class="org-titulo">Mostrar</div>
        ${FILTROS.map(([k, n]) => `<button type="button" data-filtro="${k}" class="${k === ui.filtro ? 'on' : ''}">${n}</button>`).join('')}
      </div>
    </div>
    <div class="modos">
      <button type="button" data-vista="lista" title="Ver em lista" class="${ui.modo === 'lista' ? 'on' : ''}">${icone('lista')}</button>
      <button type="button" data-vista="grade" title="Ver em grade" class="${ui.modo === 'grade' ? 'on' : ''}">${icone('grade')}</button>
    </div>`;
}

function renderFerramentas() {
  $('#ferr-lista').innerHTML = ferramentasHTML(false);
  const g = $('#ferr-grade');
  if (g) g.innerHTML = ferramentasHTML(true);
}

function vazioFiltrado() {
  if (!ui.jogos.length) return 'Nenhum jogo na lista ainda.';
  return `Nenhum jogo encontrado.${ui.filtro !== 'todos' || ui.busca ? '<br><button type="button" class="limpar-filtro" data-limpar>Mostrar todos os jogos</button>' : ''}`;
}

function renderLista() {
  const grupos = secoes();
  $('#lista').innerHTML = grupos.length
    ? grupos.map(({ titulo, jogos }) => `<div class="lateral-titulo">${titulo || 'Seus jogos'} <span class="qtd">(${jogos.length})</span></div>`
      + jogos.map((j) => {
        const [sub, cls] = situacao(j);
        return `<button type="button" class="item ${j.id === ui.selecionado ? 'sel' : ''} ${cls}" data-id="${esc(j.id)}">
          ${arte(j, 'mini')}
          <span class="item-txt"><span class="item-nome">${esc(j.nome)}</span><span class="item-sub">${sub}</span></span>
        </button>`;
      }).join('')).join('')
    : `<p class="vazio-lista">${vazioFiltrado()}</p>`;
}

// ───────────── modo grade ─────────────

function botaoRapido(j) {
  const p = ui.progresso[j.id];
  if (p && p.fase === 'pausado') return `<button type="button" class="card-rapido instalar" data-acao="instalar" data-id="${esc(j.id)}" title="Continuar download">${icone('baixar')}</button>`;
  if (p || j.rodando || j.emBreve) return '';
  if (j.atualizacao) return `<button type="button" class="card-rapido atualizar" data-acao="instalar" data-id="${esc(j.id)}" title="Atualizar">${icone('baixar')}</button>`;
  if (j.instalado) return `<button type="button" class="card-rapido jogar" data-acao="jogar" data-id="${esc(j.id)}" title="Jogar">${icone('play')}</button>`;
  return `<button type="button" class="card-rapido instalar" data-acao="instalar" data-id="${esc(j.id)}" title="Instalar">${icone('baixar')}</button>`;
}

function seloCard(j) {
  if (j.rodando) return '<span class="card-selo rodando">Jogando</span>';
  if (j.atualizacao) return '<span class="card-selo atualizar">Atualização</span>';
  if (j.emBreve) return '<span class="card-selo embreve">Em breve</span>';
  return '';
}

function cardHTML(j) {
  const [sub, cls] = situacao(j);
  const p = ui.progresso[j.id];
  return `<div class="card ${cls}" data-card="${esc(j.id)}" data-estado="${p ? p.fase : ''}" tabindex="0" title="${esc(j.nome)}">
    <div class="card-capa">${arte(j, 'card-arte')}${seloCard(j)}${botaoRapido(j)}
      <div class="card-prog"><div style="width:${p ? (p.fase === 'instalando' ? 100 : pct(p)) : 0}%"></div></div></div>
    <div class="card-nome">${esc(j.nome)}</div>
    <div class="card-sub">${sub}</div>
  </div>`;
}

function renderGradeItens() {
  const el = $('#grade-itens');
  if (!el) return;
  const grupos = secoes();
  const qtd = grupos.reduce((n, g) => n + g.jogos.length, 0);
  const q = $('#grade-qtd');
  if (q) q.textContent = `(${qtd})`;
  el.innerHTML = grupos.length
    ? grupos.map(({ titulo, jogos }) => `${titulo ? `<h3 class="grade-secao">${titulo} <span class="qtd">(${jogos.length})</span></h3>` : ''}
      <div class="grade">${jogos.map(cardHTML).join('')}</div>`).join('')
    : `<div class="grade-vazia">${vazioFiltrado()}</div>`;
}

function renderGrade() {
  $('#detalhe').innerHTML = `<div class="grade-pagina">
    <div class="grade-topo"><h2>Biblioteca<span class="qtd" id="grade-qtd"></span></h2><div class="ferramentas" id="ferr-grade" style="margin:0;flex-wrap:wrap"></div></div>
    <div id="grade-itens"></div>
  </div>`;
  $('#ferr-grade').innerHTML = ferramentasHTML(true);
  renderGradeItens();
}

// Durante o download, só mexe no card (sem redesenhar a grade inteira).
function atualizarCard(id) {
  const card = document.querySelector(`.card[data-card="${CSS.escape(id)}"]`);
  const j = ui.jogos.find((x) => x.id === id);
  if (!card || !j) return;
  const [sub, cls] = situacao(j);
  const p = ui.progresso[id];
  if ((p ? p.fase : '') !== card.dataset.estado) { card.outerHTML = cardHTML(j); return; }
  card.className = `card ${cls}`;
  card.querySelector('.card-sub').textContent = sub;
  card.querySelector('.card-prog div').style.width = `${p ? (p.fase === 'instalando' ? 100 : pct(p)) : 0}%`;
}

const naGrade = () => ui.modo === 'grade' && !ui.gradeAberta;

function aplicarModo() {
  document.body.classList.toggle('modo-grade', ui.modo === 'grade');
  $('#busca').value = ui.busca;
  renderFerramentas();
}

function renderDetalhe() {
  if (naGrade()) return renderGrade();
  const j = jogoSel();
  const el = $('#detalhe');
  if (!j) {
    el.innerHTML = `<div class="vazio"><h2>Nenhum jogo por aqui</h2>
      <p>Adicione jogos no <code>jogos.json</code> pra eles aparecerem na biblioteca.</p></div>`;
    return;
  }
  el.innerHTML = `
    <section class="hero">
      ${ui.modo === 'grade' ? `<button type="button" class="voltar" data-voltar>${icone('voltar')}Biblioteca</button>` : ''}
      ${arte(j, 'hero-arte')}
      <div class="hero-sombra"></div>
      <div class="hero-info">
        ${j.genero ? `<span class="etiqueta">${esc(j.genero)}</span>` : ''}
        <h1>${esc(j.nome)}</h1>
        <p class="dev">${esc(j.desenvolvedor || 'TLW Games')}</p>
      </div>
    </section>
    <section class="barra-acao" id="barra-acao"></section>
    ${j.removido ? '<p class="aviso">Esse jogo saiu da lista da TLW Games, mas continua instalado no seu computador.</p>' : ''}
    <section class="info">
      <div class="bloco"><h3>Sobre o jogo</h3>
        <p class="ficha">${esc([j.genero, j.desenvolvedor || 'TLW Games'].filter(Boolean).join(' · '))}</p>
        <p>${esc(String(j.descricao || 'Sem descrição.').trim())}</p></div>
      <div class="bloco"><h3>${j.emBreve ? 'Sobre o lançamento' : `Novidades da versão ${esc(j.versao || '')}`}</h3><p class="notas">${esc(String(j.notas || (j.emBreve ? 'Fique de olho: ative o "Me avise" pra saber quando sair.' : 'Sem notas para esta versão.')).trim())}</p></div>
    </section>
    <div class="secoes">
      ${secaoGaleria(j)}
    </div>`;
  renderAcao(true);
  carregarExtras(j.id);
}

// ───────────── galeria ─────────────

function fotosDe(j) { return [].concat(j.galeria || []).filter((u) => typeof u === 'string' && u); }

function secaoGaleria(j) {
  const fotos = fotosDe(j);
  if (!fotos.length) return '';
  return `<section class="secao"><h3>Galeria <span class="qtd">${fotos.length} ${fotos.length === 1 ? 'imagem' : 'imagens'}</span></h3>
    <div class="galeria">${fotos.map((u, i) => `<button type="button" class="foto" data-foto="${i}" title="Ampliar"><img src="${esc(srcImagem(u, 400, 225, 'cover'))}" data-orig="${esc(u)}" onerror="${ERRO_IMG}" alt="" loading="lazy" referrerpolicy="no-referrer"></button>`).join('')}</div></section>`;
}

const visor = { fotos: [], i: 0 };

function abrirVisor(fotos, i) {
  visor.fotos = fotos;
  visor.i = i;
  let el = $('#visor');
  if (!el) {
    el = document.createElement('div');
    el.id = 'visor';
    el.className = 'visor';
    el.innerHTML = `<img alt="" referrerpolicy="no-referrer">
      <button type="button" class="visor-nav ant" data-visor="-1" title="Anterior">${icone('voltar')}</button>
      <button type="button" class="visor-nav prox" data-visor="1" title="Próxima">${icone('voltar')}</button>
      <button type="button" class="visor-fechar" data-visor="fechar" title="Fechar (Esc)">${icone('fechar')}</button>
      <div class="visor-cont"></div>`;
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-visor]');
      if (b) { if (b.dataset.visor === 'fechar') fecharVisor(); else moverVisor(Number(b.dataset.visor)); return; }
      if (e.target === el) fecharVisor();
    });
    document.body.appendChild(el);
  }
  mostrarVisor();
  el.classList.add('aberto');
}

function mostrarVisor() {
  const el = $('#visor');
  el.querySelector('img').src = visor.fotos[visor.i];
  el.querySelector('.visor-cont').textContent = `${visor.i + 1} de ${visor.fotos.length}`;
  el.querySelectorAll('.visor-nav').forEach((b) => { b.style.display = visor.fotos.length > 1 ? '' : 'none'; });
}

function moverVisor(d) {
  visor.i = (visor.i + d + visor.fotos.length) % visor.fotos.length;
  mostrarVisor();
}

function fecharVisor() { const el = $('#visor'); if (el) el.classList.remove('aberto'); }
const visorAberto = () => { const el = $('#visor'); return !!(el && el.classList.contains('aberto')); };

// ───────────── contador de downloads (GitHub) ─────────────

ui.extras = {};

async function carregarExtras(id) {
  if (ui.extras[id]) return;
  ui.extras[id] = { carregando: true };
  try { ui.extras[id] = await tlw.chamar('extras', { id }); } catch { ui.extras[id] = {}; }
  const j = jogoSel();
  if (j && j.id === id && !naGrade()) renderAcao(true);
}

function renderAcao(forcar) {
  const j = jogoSel();
  const el = $('#barra-acao');
  if (!j || !el) return;
  const p = ui.progresso[j.id];

  // Durante o download só atualiza a barra, sem recriar os botões (assim eles não piscam).
  if (p && !forcar && el.dataset.modo === 'prog' && el.dataset.fase === p.fase) {
    const porc = pct(p);
    el.querySelector('.progresso-num').textContent = textoProgresso(p);
    const ench = el.querySelector('.enchimento');
    ench.classList.toggle('indet', p.fase === 'instalando');
    ench.style.width = `${p.fase === 'instalando' ? 100 : porc}%`;
    return;
  }

  let botao;
  if (p) {
    if (p.fase === 'pausado') botao = `<button type="button" class="btn btn-prim" data-acao="instalar">${icone('play')}Continuar</button>`;
    else if (p.fase === 'instalando') botao = '<button type="button" class="btn btn-sec" disabled>Instalando…</button>';
    else botao = `<button type="button" class="btn btn-sec" data-acao="pausar">${icone('pausa')}Pausar</button>`;
  } else if (j.rodando) botao = '<button type="button" class="btn btn-jogando" disabled>Jogando…</button>';
  else if (j.emBreve) {
    botao = j.avisar
      ? `<button type="button" class="btn btn-avisando" data-acao="avisar" title="Clique pra desligar o aviso">✓ Vou te avisar</button>`
      : `<button type="button" class="btn btn-avisar" data-acao="avisar">${icone('sino')}Me avise</button>`;
  }
  else if (!j.instalado) botao = `<button type="button" class="btn btn-prim" data-acao="instalar">${icone('baixar')}Instalar</button>`;
  else if (j.atualizacao) botao = `<button type="button" class="btn btn-atual" data-acao="instalar">${icone('baixar')}Atualizar</button>`;
  else botao = `<button type="button" class="btn btn-jogar" data-acao="jogar">${icone('play')}Jogar</button>`;

  let meio;
  if (p) {
    const porc = pct(p);
    const rotulo = { fila: 'Na fila', pausado: 'Pausado', reconectando: 'Reconectando', instalando: 'Instalando' }[p.fase]
      || (j.instalado ? 'Atualizando' : 'Baixando');
    meio = `<div class="progresso">
        <div class="progresso-txt"><span class="rotulo">${rotulo}</span><span class="progresso-num">${textoProgresso(p)}</span></div>
        <div class="trilho"><div class="enchimento ${p.fase === 'instalando' ? 'indet' : ''} ${p.fase === 'pausado' ? 'pausado' : ''}" style="width:${p.fase === 'instalando' ? 100 : porc}%"></div></div>
      </div>`;
  } else if (j.emBreve) {
    const quando = j.lancamento ? Date.parse(j.lancamento) : NaN;
    const stats = Number.isNaN(quando)
      ? [['calendario', 'Lançamento', 'Data a confirmar']]
      : [['calendario', 'Lançamento', fmtDataHora(quando)], ['relogio', 'Faltam', textoContagem(quando), quando]];
    meio = `<div class="stats">${stats.map(([ic, k, v, alvo]) =>
      `<div class="stat">${icone(ic)}<span class="stat-txt"><span class="stat-k">${k}</span><span class="stat-v ${alvo ? 'contagem' : ''}" ${alvo ? `data-contagem="${alvo}"` : ''}>${esc(v)}</span></span></div>`).join('')}</div>`;
  } else {
    const ex = ui.extras[j.id] || {};
    const dl = typeof ex.downloads === 'number' ? ['baixar', 'Downloads', fmtNum(ex.downloads)] : null;
    // Em ordem de importância: o que não couber na largura da janela fica escondido.
    const stats = (j.instalado
      ? [
        ['calendario', 'Última sessão', fmtData(j.instalado.ultimaVez)],
        ['relogio', 'Tempo de jogo', fmtTempo(j.instalado.tempoJogado)],
        ['etiqueta', 'Versão', j.atualizacao ? `${j.instalado.versao} → ${j.versao}` : j.instalado.versao],
        ['disco', 'Espaço em disco', fmtBytes(j.instalado.tamanho)],
        dl,
      ]
      : [['etiqueta', 'Versão', j.versao || '—'], ['disco', 'Download', j.tamanho || '—'], dl]).filter(Boolean);
    meio = `<div class="stats">${stats.map(([ic, k, v]) =>
      `<div class="stat">${icone(ic)}<span class="stat-txt"><span class="stat-k">${k}</span><span class="stat-v">${esc(v)}</span></span></div>`).join('')}</div>`;
  }

  const extras = p
    ? (p.fase === 'instalando' ? '' : `<div class="extras"><button type="button" class="icone" data-acao="cancelar" title="Cancelar download">${icone('fechar')}</button></div>`)
    : j.instalado
    ? `<div class="extras ${ui.menuAberto ? 'aberto' : ''}">
        <button type="button" class="icone menu-btn" data-menu title="Opções do jogo">${icone('engrenagem')}</button>
        <div class="menu">
          <button type="button" data-acao="atalho">${icone('atalho')}${j.instalado.atalho ? 'Recriar atalho na área de trabalho<span class="feito">✓ criado</span>' : 'Criar atalho na área de trabalho'}</button>
          <button type="button" data-acao="verificar">${icone('escudo')}Verificar e reparar arquivos</button>
          <button type="button" data-acao="pasta">${icone('pasta')}Abrir pasta do jogo</button>
          <hr>
          <button type="button" data-acao="desinstalar" class="perigo">${icone('lixo')}Desinstalar</button>
        </div>
      </div>`
    : '';

  el.dataset.modo = p ? 'prog' : 'normal';
  el.dataset.fase = p ? p.fase : '';
  el.innerHTML = (botao || '') + meio + extras;
}

function textoProgresso(p) {
  if (p.fase === 'instalando') return 'Instalando…';
  if (p.fase === 'fila') return p.posicao ? `Esperando a vez · ${p.posicao}º na fila` : 'Esperando a vez';
  if (p.fase === 'reconectando') return p.erro || 'Reconectando…';
  if (p.fase === 'pausado') {
    const quanto = p.total ? `${pct(p)}% · ${fmtBytes(p.baixado)} de ${fmtBytes(p.total)}` : (p.baixado ? `${fmtBytes(p.baixado)} já baixados` : '');
    return [p.erro, quanto].filter(Boolean).join(' · ') || 'Clique em Continuar';
  }
  if (!p.baixado) return 'Conectando…';
  const total = p.total ? fmtBytes(p.total) : '?';
  const vel = p.vel ? ` · ${fmtBytes(p.vel)}/s` : '';
  return `${pct(p)}% · ${fmtBytes(p.baixado)} de ${total}${vel}`;
}

// ───────────── avisos ─────────────

function toast(msg, tipo = '') {
  const el = document.createElement('div');
  el.className = `toast ${tipo}`;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.classList.add('saindo'), 4500);
  setTimeout(() => el.remove(), 5000);
}

// ───────────── dados ─────────────

// Cores, nome e logo que você define no Admin (seção "launcher" do jogos.json).
function aplicarVisual(v) {
  v = v || {};
  const raiz = document.documentElement.style;
  const cor = (c) => typeof c === 'string' && /^#[0-9a-f]{3,8}$/i.test(c);
  if (cor(v.cor)) raiz.setProperty('--acento', v.cor); else raiz.removeProperty('--acento');
  if (cor(v.cor2)) raiz.setProperty('--acento2', v.cor2); else raiz.removeProperty('--acento2');
  const nome = String(v.nome || 'TLW Games').trim();
  const marca = document.querySelector('.marca');
  if (v.logo) {
    marca.innerHTML = `<img class="marca-logo" referrerpolicy="no-referrer" src="${esc(srcImagem(v.logo, 200, 34, 'contain'))}" data-orig="${esc(v.logo)}" onerror="${ERRO_IMG}" alt="${esc(nome)}">`;
  } else {
    const [primeira, ...resto] = nome.split(/\s+/);
    marca.innerHTML = `<span class="marca-tlw">${esc(primeira)}</span>${resto.length ? `<span class="marca-games">${esc(resto.join(' ').toUpperCase())}</span>` : ''}`;
  }
  document.title = `${nome} Launcher`;
}

function aplicar(r) {
  aplicarVisual(r.visual);
  ui.jogos = r.jogos;
  for (const j of r.jogos) {
    if (j.download) ui.progresso[j.id] = { ...(ui.progresso[j.id] || {}), id: j.id, ...j.download };
    else delete ui.progresso[j.id];
  }
  ui.online = r.online;
  if (!ui.jogos.some((j) => j.id === ui.selecionado)) ui.selecionado = ui.jogos[0] ? ui.jogos[0].id : null;
}

async function carregar(manual) {
  const btn = $('#btn-recarregar');
  btn.classList.add('girando');
  try {
    aplicar(await tlw.catalogo());
    render();
    if (manual) toast(ui.online ? 'Lista de jogos atualizada.' : 'Sem conexão com a lista online. Usando a última salva.', ui.online ? 'ok' : '');
  } finally {
    btn.classList.remove('girando');
  }
}

async function atualizarLocal() {
  aplicar(await tlw.lista());
  renderLista();
  renderDetalhe();
}

// ───────────── eventos ─────────────

$('#btn-recarregar').innerHTML = icone('recarregar');
$('#btn-recarregar').addEventListener('click', () => carregar(true));

document.addEventListener('input', (e) => {
  if (!e.target.matches('[data-busca]')) return;
  ui.busca = e.target.value;
  renderLista();
  renderGradeItens();
});

function fecharMenus() {
  if (!ui.orgAberto && !ui.menuAberto) return;
  ui.orgAberto = false;
  ui.menuAberto = false;
  document.querySelectorAll('.org.aberto, .extras.aberto').forEach((x) => x.classList.remove('aberto'));
}

function voltarPraGrade() {
  ui.gradeAberta = false;
  fecharMenus();
  renderDetalhe();
}

// Botões de organizar, modo lista/grade e fechar menus ao clicar fora.
document.addEventListener('click', (e) => {
  const alvo = e.target;
  if (alvo.closest('[data-organizar]')) {
    ui.orgAberto = !ui.orgAberto;
    ui.menuAberto = false;
    document.querySelectorAll('.org').forEach((x) => x.classList.toggle('aberto', ui.orgAberto && x.contains(alvo)));
    return;
  }
  const opc = alvo.closest('[data-ordem], [data-filtro], [data-vista], [data-limpar]');
  if (opc) {
    if (opc.dataset.ordem) ui.ordem = opc.dataset.ordem;
    if (opc.dataset.filtro) ui.filtro = opc.dataset.filtro;
    if (opc.dataset.vista) { ui.modo = opc.dataset.vista; ui.gradeAberta = false; }
    if (opc.hasAttribute('data-limpar')) { ui.filtro = 'todos'; ui.busca = ''; }
    ui.orgAberto = false;
    salvarPrefs();
    aplicarModo();
    renderLista();
    renderDetalhe();
    return;
  }
  if (alvo.closest('[data-menu]')) {
    ui.menuAberto = !ui.menuAberto;
    ui.orgAberto = false;
    document.querySelectorAll('.extras').forEach((x) => x.classList.toggle('aberto', ui.menuAberto));
    document.querySelectorAll('.org.aberto').forEach((x) => x.classList.remove('aberto'));
    return;
  }
  if (!alvo.closest('.org-menu, .menu')) fecharMenus();
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (ui.orgAberto || ui.menuAberto) fecharMenus();
  else if (ui.modo === 'grade' && ui.gradeAberta && !document.body.classList.contains('ver-config')) voltarPraGrade();
});

$('#lista').addEventListener('click', (e) => {
  const item = e.target.closest('.item');
  if (!item || item.dataset.id === ui.selecionado) return;
  ui.selecionado = item.dataset.id;
  ui.menuAberto = false;
  renderLista();
  renderDetalhe();
});

function atualizarJogoNaTela(id) {
  renderLista();
  if (naGrade()) atualizarCard(id);
  else if (id === ui.selecionado) renderAcao(true);
}

async function baixarJogo(j, textoOk) {
  ui.progresso[j.id] = { ...(ui.progresso[j.id] || { baixado: 0, total: 0 }), id: j.id, fase: 'fila', erro: '' };
  atualizarJogoNaTela(j.id);
  const r = await tlw.instalar(j.id);
  if (r && r.ok) toast(textoOk || (r.atualizou ? `${j.nome} atualizado!` : `${j.nome} instalado! Bora jogar.`), 'ok');
  else if (r && r.cancelado) toast('Download cancelado.');
}

async function verificarJogo(j) {
  toast(`Verificando os arquivos de ${j.nome}…`);
  const r = await tlw.chamar('verificar', { id: j.id });
  let reparar;
  if (r.ok && r.semLista) {
    reparar = confirm(`${j.nome} foi instalado antes de o launcher guardar a lista de arquivos, então só deu pra conferir o arquivo principal, e ele está ok.\n\nQuer baixar o jogo de novo mesmo assim, pra garantir?`);
  } else if (r.ok) {
    toast(`Tudo certo! ${r.total} ${r.total === 1 ? 'arquivo verificado' : 'arquivos verificados'} em ${j.nome}.`, 'ok');
    return;
  } else {
    reparar = confirm(`Encontrei ${r.problemas} ${r.problemas === 1 ? 'arquivo faltando ou danificado' : 'arquivos faltando ou danificados'} em ${j.nome}.\n\nBaixar o jogo de novo pra reparar?${j.tamanho ? ` (${j.tamanho})` : ''}\n\nObs.: se o jogo guarda o progresso dentro da pasta dele, esse progresso pode ser perdido.`);
  }
  if (reparar) await baixarJogo(j, `${j.nome} reparado!`);
}

$('#detalhe').addEventListener('click', async (e) => {
  if (e.target.closest('[data-voltar]')) return voltarPraGrade();
  const b = e.target.closest('[data-acao]');
  if (!b) {
    const card = e.target.closest('[data-card]');
    if (card) {
      ui.selecionado = card.dataset.card;
      ui.gradeAberta = true;
      ui.menuAberto = false;
      renderLista();
      renderDetalhe();
      $('#detalhe').scrollTop = 0;
    }
    return undefined;
  }
  if (b.disabled) return undefined;
  const id = b.dataset.id || ui.selecionado;
  const j = ui.jogos.find((x) => x.id === id);
  if (!j) return undefined;
  if (b.closest('.menu')) fecharMenus();
  try {
    switch (b.dataset.acao) {
      case 'instalar': await baixarJogo(j); break;
      case 'atalho':
        await tlw.chamar('atalho', { id });
        toast(`Atalho de ${j.nome} criado na área de trabalho.`, 'ok');
        break;
      case 'verificar': await verificarJogo(j); break;
      case 'cancelar': await tlw.cancelar(id); break;
      case 'pausar': await tlw.pausar(id); break;
      case 'avisar': {
        const r = await tlw.chamar('avisar', { id, ligado: !j.avisar });
        toast(r.avisar ? `Pronto! Você recebe um aviso quando ${j.nome} sair.` : 'Aviso desligado.', r.avisar ? 'ok' : '');
        break;
      }
      case 'jogar': await tlw.jogar(id); break;
      case 'desinstalar': {
        const r = await tlw.desinstalar(id, j.nome);
        if (r && r.ok) toast(`${j.nome} foi desinstalado.`);
        break;
      }
      case 'pasta': await tlw.abrirPasta(id); break;
      default: break;
    }
  } catch (err) {
    toast(limparErro(err), 'erro');
    await atualizarLocal().catch(() => {});
  }
  return undefined;
});

// Galeria (cliques dentro da página do jogo).
$('#detalhe').addEventListener('click', (e) => {
  const f = e.target.closest('[data-foto]');
  if (f) { const j = jogoSel(); if (j) abrirVisor(fotosDe(j), Number(f.dataset.foto)); }
});

document.addEventListener('keydown', (e) => {
  if (!visorAberto()) return;
  if (e.key === 'Escape') { e.stopPropagation(); fecharVisor(); }
  if (e.key === 'ArrowLeft') moverVisor(-1);
  if (e.key === 'ArrowRight') moverVisor(1);
}, true);

// Contagem regressiva dos lançamentos (atualiza a cada segundo).
setInterval(() => {
  let chegou = false;
  document.querySelectorAll('[data-contagem]').forEach((el) => {
    const alvo = Number(el.dataset.contagem);
    el.textContent = textoContagem(alvo);
    if (alvo <= Date.now() && !el.dataset.chegou) { el.dataset.chegou = '1'; chegou = true; }
  });
  if (chegou) setTimeout(() => { atualizarLocal().catch(() => {}); }, 2500);
}, 1000);

$('#detalhe').addEventListener('keydown', (e) => {
  const card = e.target.closest('[data-card]');
  if (card && e.target === card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); card.click(); }
});

tlw.aoProgresso((d) => {
  if (d.fase === 'fim') delete ui.progresso[d.id];
  else ui.progresso[d.id] = { ...(ui.progresso[d.id] || {}), ...d };
  renderLista();
  if (naGrade()) atualizarCard(d.id);
  else if (d.id === ui.selecionado) renderAcao(d.fase === 'fim');
});

tlw.aoMudar(() => { atualizarLocal(); });
tlw.aoEvento('lancou', (d) => toast(`🎉 ${d.nome} chegou! Já dá pra instalar.`, 'ok'));

// ───────────── aba Configurações ─────────────

const FUNCIONA_SEM_EXE = new Set(['discord']);
const cfgUI = { dados: null, procurando: false, nova: null, movendo: false, msgVersao: '' };

const OPCOES = [
  ['Inicialização', [
    ['iniciarComWindows', 'Abrir junto com o Windows', 'O launcher abre sozinho quando você liga o PC.'],
    ['iniciarMinimizado', 'Abrir minimizado', 'Quando abrir junto com o Windows, fica só no ícone perto do relógio.', 'iniciarComWindows'],
  ]],
  ['Segundo plano', [
    ['segundoPlano', 'Continuar rodando ao fechar a janela', 'O launcher fica no ícone perto do relógio e continua de olho nas atualizações.'],
    ['avisarAtualizacoes', 'Avisar quando um jogo tiver atualização', 'Mostra um aviso do Windows quando sair versão nova de um jogo que você tem.'],
  ]],
  ['Discord', [
    ['discord', 'Mostrar no Discord o jogo que você está jogando', 'Aparece "Jogando..." no seu perfil enquanto o jogo estiver aberto. Precisa do Discord aberto no PC.'],
  ]],
  ['Jogos', [
    ['atualizarAuto', 'Atualizar os jogos automaticamente', 'Baixa as atualizações sozinho, sem você precisar clicar (menos de jogos que estiverem abertos).'],
    ['minimizarAoJogar', 'Minimizar o launcher ao abrir um jogo', 'Tira o launcher da frente quando o jogo abre.'],
  ]],
];

function chave(k, ligado, desativado) {
  return `<label class="chave"><input type="checkbox" data-opcao="${k}" ${ligado ? 'checked' : ''} ${desativado ? 'disabled' : ''}><span></span></label>`;
}

function renderConfig() {
  const el = $('#config');
  const d = cfgUI.dados;
  if (!d) { el.innerHTML = '<div class="carregando"><div class="spinner"></div>Carregando…</div>'; return; }
  const c = d.config;
  const semExe = !d.exe;
  const grupos = OPCOES.map(([titulo, itens]) => {
    const linhas = itens.map(([k, nome, desc, depende]) => {
      const off = (semExe && !FUNCIONA_SEM_EXE.has(k)) || (depende && !c[depende]);
      return `<div class="opcao ${off ? 'desligada' : ''}"><div class="opcao-txt"><div class="opcao-titulo">${nome}</div><div class="opcao-desc">${desc}</div></div>${chave(k, c[k], off)}</div>`;
    }).join('');
    const pasta = titulo !== 'Jogos' ? '' : `
      <div class="opcao"><div class="opcao-txt"><div class="opcao-titulo">Pasta dos jogos</div>
        <div class="opcao-desc">Os jogos instalados vão junto pra pasta nova.</div>
        <div class="pasta-caminho">${esc(d.pastaAtual)}</div></div>
        <div class="botoes">
          <button type="button" class="btn-peq" data-cfg="pasta-abrir">Abrir</button>
          <button type="button" class="btn-peq" data-cfg="pasta-mudar" ${cfgUI.movendo ? 'disabled' : ''}>${cfgUI.movendo ? 'Movendo jogos…' : 'Alterar…'}</button>
          ${d.pastaAtual !== d.pastaPadrao ? `<button type="button" class="btn-peq" data-cfg="pasta-padrao" ${cfgUI.movendo ? 'disabled' : ''}>Voltar pro padrão</button>` : ''}
        </div></div>`;
    return `<div class="grupo"><h3>${titulo}</h3>${linhas}${pasta}</div>`;
  }).join('');

  let sobreBotao;
  if (cfgUI.nova) sobreBotao = `<button type="button" class="btn-peq destaque" data-cfg="reiniciar">Reiniciar e atualizar</button>`;
  else sobreBotao = `<button type="button" class="btn-peq" data-cfg="procurar" ${semExe || cfgUI.procurando ? 'disabled' : ''}>${cfgUI.procurando ? 'Procurando…' : 'Procurar atualizações'}</button>`;

  el.innerHTML = `<div class="config-miolo">
    <h2>Configurações</h2>
    <p class="sub">As mudanças são salvas na hora.</p>
    ${semExe ? '<div class="aviso-exe">Você está rodando pelo <b>node launcher.js</b>. Algumas opções só funcionam na versão .exe.</div>' : ''}
    ${grupos}
    <div class="grupo"><h3>Sobre</h3>
      <div class="opcao"><div class="opcao-txt"><div class="opcao-titulo">Versão do launcher</div>
        <div class="opcao-desc">${d.versaoApp ? esc(d.versaoApp) : 'versão de teste'}${cfgUI.msgVersao ? ` · ${esc(cfgUI.msgVersao)}` : ''}</div>
        <div class="opcao-desc">O launcher procura atualizações sozinho toda vez que abre.</div></div>
        <div class="botoes">${sobreBotao}</div></div>
    </div>
  </div>`;
}

async function abrirAba(aba) {
  if (aba === 'biblioteca' && !document.body.classList.contains('ver-config') && ui.modo === 'grade' && ui.gradeAberta) voltarPraGrade();
  fecharMenus();
  document.body.classList.toggle('ver-config', aba === 'config');
  document.querySelectorAll('.abas .aba').forEach((b) => b.classList.toggle('ativa', b.dataset.aba === aba));
  if (aba === 'config') {
    renderConfig();
    try { cfgUI.dados = await tlw.chamar('config-ver'); } catch (e) { toast(limparErro(e), 'erro'); }
    renderConfig();
  }
}

document.querySelector('.abas').addEventListener('click', (e) => {
  const b = e.target.closest('.aba');
  if (b && b.dataset.aba) abrirAba(b.dataset.aba);
});

$('#config').addEventListener('change', async (e) => {
  const k = e.target.dataset.opcao;
  if (!k) return;
  try {
    cfgUI.dados = await tlw.chamar('config-salvar', { mudancas: { [k]: e.target.checked } });
    toast('Configuração salva.', 'ok');
  } catch (err) { toast(limparErro(err), 'erro'); }
  renderConfig();
});

$('#config').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-cfg]');
  if (!b || b.disabled) return;
  const acao = b.dataset.cfg;
  try {
    if (acao === 'pasta-abrir') return void await tlw.abrirPasta('');
    if (acao === 'pasta-mudar' || acao === 'pasta-padrao') {
      let pedido;
      if (acao === 'pasta-padrao') pedido = { pasta: cfgUI.dados.pastaPadrao };
      else if (cfgUI.dados.exe) pedido = { escolher: true };
      else {
        const p = prompt('Caminho da nova pasta dos jogos:', cfgUI.dados.pastaAtual);
        if (!p) return;
        pedido = { pasta: p };
      }
      const antes = cfgUI.dados.pastaAtual;
      cfgUI.dados = await tlw.chamar('config-pasta', pedido);
      if (cfgUI.dados.pastaAtual !== antes) toast('Pasta dos jogos alterada.', 'ok');
    }
    if (acao === 'procurar') {
      cfgUI.procurando = true; renderConfig();
      const r = await tlw.chamar('app-procurar');
      cfgUI.nova = r.nova;
      cfgUI.msgVersao = r.nova ? `versão ${r.nova} baixada` : (r.msg || 'você já está na versão mais nova');
    }
    if (acao === 'reiniciar') return void await tlw.chamar('app-reiniciar');
  } catch (err) {
    toast(limparErro(err), 'erro');
  } finally {
    cfgUI.procurando = false; cfgUI.movendo = false;
  }
  renderConfig();
});

tlw.aoEvento('pasta', (d) => { cfgUI.movendo = d.fase === 'movendo'; renderConfig(); });


aplicarModo();
carregar(false);

</script>
</body>
</html>
